esphome:
  # platformio_options: 
    # abc: def
  name: esp32cam

esp32:
  board: esp32cam
  framework:
    type: arduino
    version: recommended


output:
- platform: ledc
  pin: GPIO4
  id: gpio_4
  channel: 2

light:
  - platform: monochromatic
    output: gpio_4
    name: Flash/PWM Light
    restore_mode: ALWAYS_OFF

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: pDKouA1bOPtYPOGi2VB20TcYLuTO74tGEkGo3Il4zw4=
#  password: !secret api_password

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret ssid
  password: !secret ssid_password
  fast_connect: on

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32Cam Fallback Hotspot"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - platform: wifi_signal
    id: signal_strength
    name: "Wifi Signal Strength"
    update_interval: 60s

# Example configuration entry
esp32_camera:
  id: camera1
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

  # Image settings
  aec2: True
  aec_mode: AUTO
  name: My Camera
#  resolution: 800X600
  resolution: 1280x1024
  max_framerate: 12 fps
  idle_framerate: 1 fps
  jpeg_quality: 10
  wb_mode: home
  agc_gain_ceiling: 8x
  vertical_flip: False
  horizontal_mirror: False

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot